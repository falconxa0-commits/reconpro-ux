<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#4FADDB" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#coverBg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <!-- Grid -->
  <g stroke="#C9A96E" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="270" x2="1920" y2="270"/><line x1="0" y1="540" x2="1920" y2="540"/><line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/><line x1="960" y1="0" x2="960" y2="1080"/><line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="1500" cy="300" r="200" fill="none" stroke="#4FADDB" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="1500" cy="300" r="140" fill="none" stroke="#4FADDB" stroke-opacity="0.04" stroke-width="1"/>
  <circle cx="400" cy="800" r="150" fill="none" stroke="#C9A96E" stroke-opacity="0.05" stroke-width="2"/>
  <!-- Logo -->
  <rect x="160" y="380" width="200" height="200" rx="32" fill="#111111" stroke="#C9A96E" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="260" y="490" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="900" fill="#C9A96E" text-anchor="middle">RP</text>
  <!-- Title -->
  <text x="440" y="460" font-family="Inter, Arial, sans-serif" font-size="120" font-weight="900" fill="#ffffff" letter-spacing="-3">ReconPro</text>

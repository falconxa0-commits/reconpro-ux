  <!-- Bottom bar -->
  <rect x="160" y="800" width="1600" height="1" fill="#C9A96E" fill-opacity="0.15"/>
  <text x="160" y="850" font-family="JetBrains Mono, monospace" font-size="16" font-weight="400" fill="#666666">Next.js 16  ·  React 19  ·  TypeScript  ·  Prisma 6  ·  15 Scanner Modules  ·  Enterprise Security</text>
  <text x="160" y="880" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#C9A96E">v0.2.0 — August 2026</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#C9A96E" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#gold)"/>
  <!-- Grid lines for tech feel -->
  <line x1="0" y1="0" x2="1200" y2="630" stroke="#C9A96E" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="400" y1="0" x2="1200" y2="630" stroke="#4FADDB" stroke-opacity="0.03" stroke-width="1"/>
  <!-- Logo -->
  <rect x="80" y="200" width="140" height="140" rx="24" fill="#111111" stroke="#C9A96E" stroke-opacity="0.3" stroke-width="1"/>
  <text x="150" y="280" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="900" fill="#C9A96E" text-anchor="middle">RP</text>
  <!-- Title -->
  <text x="260" y="260" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-2">ReconPro</text>
  <text x="260" y="305" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#C9A96E" letter-spacing="4">ENTERPRISE ATTACK SURFACE MANAGEMENT</text>
  <!-- Tagline -->
  <text x="80" y="430" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#999999">See everything. Protect everything.</text>
  <!-- Version -->
  <rect x="80" y="470" width="120" height="32" rx="16" fill="#C9A96E" fill-opacity="0.15"/>
  <text x="140" y="491" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600" fill="#C9A96E" text-anchor="middle">v0.2.0</text>
  <!-- Decorative elements -->
  <circle cx="1050" cy="150" r="80" fill="none" stroke="#4FADDB" stroke-opacity="0.1" stroke-width="2"/>
  <circle cx="1050" cy="150" r="50" fill="none" stroke="#4FADDB" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="1100" cy="500" r="100" fill="none" stroke="#C9A96E" stroke-opacity="0.06" stroke-width="2"/>
</svg>

# Render Deployment
# Deploy to Render: https://render.com

# Option 1: Web Service (Docker)
# 1. Create a new Web Service on Render
# 2. Connect your GitHub repo
# 3. Use Dockerfile as the build command
# 4. Add persistent disk at /app/db for SQLite
# 5. Set environment variables from production.env.example

# Option 2: Web Service (Node.js)
# Build Command: npm ci && npx prisma generate && npm run build
# Start Command: node .next/standalone/server.js
# Environment: NODE_ENV=production

# Render.yaml (Infrastructure as Code)
services:
  - type: web
    name: reconpro
    runtime: docker
    plan: starter # or standard, pro
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/app/db/reconpro.db
    disk:
      name: db
      mountPath: /app/db
      sizeGB: 5
    healthCheckPath: /api/health

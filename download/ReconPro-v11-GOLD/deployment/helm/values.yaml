replicaCount: 1
image:
  repository: reconpro
  tag: "11.0.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 3000
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: reconpro.local
      paths:
        - path: /
  tls:
    - secretName: reconpro-tls
      hosts: [reconpro.local]
resources:
  limits: { cpu: 1000m, memory: 512Mi }
  requests: { cpu: 250m, memory: 128Mi }

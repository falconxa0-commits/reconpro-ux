# DigitalOcean App Platform Deployment
# Deploy to DigitalOcean: https://www.digitalocean.com/products/app-platform

# Option 1: Docker (recommended)
# 1. Create a new App
# 2. Choose "Docker Hub" or "GitHub" as source
# 3. Set Dockerfile path
# 4. Add a persistent volume at /app/db (min 1GB)
# 5. Set environment variables from production.env.example

# Option 2: Node.js (via app spec)
spec:
  name: reconpro
  services:
    - name: reconpro-app
      git:
        repo: your-repo-url
        branch: main
      build_command: npm ci && npx prisma generate && npm run build
      run_command: node .next/standalone/server.js
      environment_slug: node-js
      instance_count: 1
      instance_size_slug: basic-xxs
      envs:
        - key: NODE_ENV
          value: production
        - key: DATABASE_URL
          value: "file:/app/db/reconpro.db"
      routes:
        - path: /
      mounts:
        - source: db-volume
          target: /app/db

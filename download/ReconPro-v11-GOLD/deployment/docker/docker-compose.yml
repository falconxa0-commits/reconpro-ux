version: "3.9"

services:
  # ── ReconPro Application ──────────────────────────────────────────
  reconpro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reconpro-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/reconpro.db
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - reconpro-data:/app/db
    networks:
      - reconpro-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── Nginx Reverse Proxy (optional, for production TLS) ────────────
  nginx:
    image: nginx:alpine
    container_name: reconpro-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - nginx-certs:/etc/nginx/certs
    depends_on:
      reconpro:
        condition: service_healthy
    networks:
      - reconpro-net
    profiles:
      - production

volumes:
  reconpro-data:
    driver: local
  nginx-certs:
    driver: local

networks:
  reconpro-net:
    driver: bridge

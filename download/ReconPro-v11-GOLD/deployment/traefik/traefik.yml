{
  "api": {
    "dashboard": true,
    "insecure": false
  },
  "entryPoints": {
    "web": {
      "address": ":80",
      "http": {
        "redirections": {
          "entryPoint": {
            "to": "websecure",
            "scheme": "https"
          }
        }
      }
    },
    "websecure": {
      "address": ":443",
      "http": {
        "tls": {
          "certResolver": "letsencrypt"
        }
      }
    }
  },
  "certificatesResolvers": {
    "letsencrypt": {
      "acme": {
        "email": "admin@reconpro.local",
        "storage": "/etc/traefik/acme.json",
        "httpChallenge": {
          "entryPoint": "web"
        }
      }
    }
  },
  "providers": {
    "file": {
      "filename": "/etc/traefik/dynamic.yml",
      "watch": true
    }
  }
}
{
  "http": {
    "routers": {
      "reconpro": {
        "rule": "Host(`reconpro.local`)",
        "entryPoints": [
          "websecure"
        ],
        "service": "reconpro",
        "tls": {
          "certResolver": "letsencrypt"
        }
      }
    },
    "services": {
      "reconpro": {
        "loadBalancer": {
          "servers": [
            {
              "url": "http://127.0.0.1:3000"
            }
          ]
        }
      }
    },
    "middlewares": {
      "security-headers": {
        "headers": {
          "frameDeny": true,
          "contentTypeNosniff": true,
          "browserXssFilter": true,
          "stsSeconds": 63072000
        }
      }
    }
  }
}
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesec"
version = "0.1.0"
description = "AI/Vibe-Coding Vulnerability Benchmark — Is your AI-built app secure?"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "ReconPro Security", email = "security@reconpro.io"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
keywords = ["security", "scanner", "vibe-coding", "ai", "vulnerability", "benchmark", "vibesec"]
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
vibesec = "vibesec.cli:main"

[tool.setuptools]
packages = ["vibesec"]

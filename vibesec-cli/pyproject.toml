[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconpro"
version = "7.2.2"
description = "ReconPro Nexus v7 — Async Engine. Swarm Intelligence. Attack-Path Chaining. 40+ Subcommands. Next-Gen Security Platform."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "ReconPro Security", email = "security@reconpro.io"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
keywords = [
    "security", "scanner", "reconnaissance", "vulnerability",
    "reconpro", "vibesec", "pentest", "red-team", "auth-bypass",
    "ssrf", "bot-detection", "nhi", "cloud-security",
    "chat", "tui", "agent", "swarm", "adversarial",
    "knowledge-graph", "ast", "cve", "sarif", "blitz", "subdomain",
    "evasion", "proxy", "async", "fuzzer", "iac", "container",
    "compliance", "mitm", "collaboration", "benchmark", "waf",
]
dependencies = [
    "rich>=13.0.0",
    "textual>=0.40.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
async = ["aiohttp>=3.9.0"]
browser = ["playwright>=1.40.0"]
llm = ["openai>=1.0.0", "anthropic>=0.18.0"]
graph = ["networkx>=3.0"]
raw = ["scapy>=2.5.0"]
intel = ["shodan>=1.25.0"]
collab = ["websockets>=12.0"]
integrations = ["jira>=3.0", "slack-sdk>=3.0"]
full = ["aiohttp>=3.9.0", "playwright>=1.40.0", "openai>=1.0.0", "anthropic>=0.18.0", "networkx>=3.0", "scapy>=2.5.0", "shodan>=1.25.0", "websockets>=12.0", "jira>=3.0", "slack-sdk>=3.0"]

[project.scripts]
reconpro = "reconpro.cli:main"

[tool.setuptools]
packages = [
    "reconpro",
    "reconpro.modules",
    "reconpro.integrations",
    "reconpro.widgets",
]

[tool.setuptools.package-data]
reconpro = ["**/*.py"]
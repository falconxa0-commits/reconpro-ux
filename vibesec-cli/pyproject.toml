[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconpro"
version = "6.0.0"
description = "ReconPro Nexus v6 — Swarm Intelligence. Agentic AI. Knowledge Graph. Eleven Blades."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "ReconPro Security", email = "security@reconpro.io"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
keywords = [
    "security", "scanner", "reconnaissance", "vulnerability",
    "reconpro", "vibesec", "pentest", "red-team", "auth-bypass",
    "ssrf", "bot-detection", "nhi", "cloud-security",
    "chat", "tui", "agent", "swarm", "adversarial",
    "knowledge-graph", "ast", "cve", "sarif", "blitz", "subdomain",
]
dependencies = [
    "rich>=13.0.0",
    "textual>=0.40.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40.0"]
llm = ["openai>=1.0.0", "anthropic>=0.18.0"]
graph = ["networkx>=3.0"]
full = ["playwright>=1.40.0", "openai>=1.0.0", "anthropic>=0.18.0", "networkx>=3.0"]

[project.scripts]
reconpro = "reconpro.cli:main"

[tool.setuptools]
packages = ["reconpro", "reconpro.modules"]
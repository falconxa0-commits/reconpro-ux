version: "3.9"

services:
  roast-bot:
    build: .
    container_name: vibesec-roast-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./bot/.cache:/app/bot/.cache
      - ./bot/.credentials.json:/app/bot/.credentials.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

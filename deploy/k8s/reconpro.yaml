apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconpro
  labels:
    app: reconpro
    version: v0.2.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reconpro
  template:
    metadata:
      labels:
        app: reconpro
        version: v0.2.0
    spec:
      containers:
        - name: reconpro
          image: reconpro:0.2.0
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: reconpro-secrets
                  key: database-url
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: db-data
              mountPath: /app/db
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: reconpro-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: reconpro
spec:
  selector:
    app: reconpro
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reconpro
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - reconpro.example.com
      secretName: reconpro-tls
  rules:
    - host: reconpro.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reconpro
                port:
                  number: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reconpro-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconpro-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reconpro-nginx
  template:
    metadata:
      labels:
        app: reconpro-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-config
          configMap:
            name: reconpro-nginx-config

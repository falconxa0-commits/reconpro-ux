# Railway Deployment
# Deploy to Railway: https://railway.app

# Option 1: Auto-deploy from GitHub
# 1. Connect your GitHub repo to Railway
# 2. Railway auto-detects Next.js and deploys
# 3. Set environment variable: DATABASE_URL=file:/app/db/reconpro.db
# 4. Add a volume mount at /app/db for persistent SQLite storage

# Option 2: Via railway.toml
[build]
builder = "nixpacks"
buildCommand = "npm ci && npx prisma generate && npm run build"

[deploy]
startCommand = "node .next/standalone/server.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
PORT = "3000"
DATABASE_URL = "file:/app/db/reconpro.db"

# Volume for persistent SQLite database
[[volumes]]
mountPath = "/app/db"

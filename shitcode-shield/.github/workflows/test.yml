name: ShitCode Shield Test

on:
  pull_request:
    paths:
      - 'shitcode-shield/**'
  push:
    branches: [main]
    paths:
      - 'shitcode-shield/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: shitcode-shield
        run: npm install

      - name: TypeScript check
        working-directory: shitcode-shield
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: shitcode-shield
        run: npx ts-node src/__tests__/diff-scanner.test.ts

  self-scan:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - name: ShitCode Shield scans itself
        uses: ./shitcode-shield
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-style: 'branded'

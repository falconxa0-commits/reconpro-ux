name: 'ShitCode Shield'
description: 'Scan AI-generated code in PRs for security vulnerabilities. By VibeSec/ReconPro.'
inputs:
  github-token:
    description: 'GitHub token for posting comments'
    required: true
  scan-deployed-url:
    description: 'Optional: also run VibeSec against the deployed URL'
    required: false
  fail-on-critical:
    description: 'Exit with error code 1 if critical findings found'
    required: false
    default: 'true'
  comment-style:
    description: 'Comment style: branded (default) or minimal'
    required: false
    default: 'branded'
runs:
  using: 'node20'
  main: 'dist/index.js'
branding:
  icon: 'shield'
  color: 'green'

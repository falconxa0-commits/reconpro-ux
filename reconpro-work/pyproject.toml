[build-system]
requires = ['setuptools>=61.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'reconpro'
version = '10.0.0'
description = 'ReconPro v10 — Enterprise Security Reconnaissance Platform. 27 Modules. 50+ Commands. MITRE ATT&CK. SARIF/PDF/CSV. Zero Dependencies Core. Pure Python.'
readme = 'README.md'
license = {text = 'MIT'}
requires-python = '>=3.8'
authors = [{name = 'ReconPro Security', email = 'security@reconpro.io'}]
keywords = ['security','scanner','reconnaissance','vulnerability','pentest','osint','subdomain','mitre-attack','sarif','fuzzer','waf-bypass','grpc','lfi','rfi','timing-attack','webhook','plugin']
classifiers = [
    'Development Status :: 4 - Beta',
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Intended Audience :: Information Technology',
    'Intended Audience :: System Administrators',
    'Programming Language :: Python :: 3',
    'Topic :: Security',
]
dependencies = ['rich>=13.0.0', 'textual>=0.40.0', 'requests>=2.28.0']

[project.optional-dependencies]
async = ['aiohttp>=3.9.0']
browser = ['playwright>=1.40.0']
llm = ['openai>=1.0.0', 'anthropic>=0.18.0']
graph = ['networkx>=3.0']
raw = ['scapy>=2.5.0']
intel = ['shodan>=1.25.0']
collab = ['websockets>=12.0']
integrations = ['jira>=3.0', 'slack-sdk>=3.0']
full = ['aiohttp>=3.9.0', 'playwright>=1.40.0', 'openai>=1.0.0', 'anthropic>=0.18.0', 'networkx>=3.0', 'scapy>=2.5.0', 'shodan>=1.25.0', 'websockets>=12.0']

[project.scripts]
reconpro = 'reconpro.cli:main'

[tool.setuptools.packages.find]
where = ['.']

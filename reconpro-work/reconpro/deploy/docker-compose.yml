# =============================================================================
# ReconPro v11 Enterprise — Docker Compose (Production)
# =============================================================================
#
# Usage:
#   docker compose up -d                          # Start in background
#   docker compose up -d --scale reconpro-api=3    # Scale horizontally
#   docker compose logs -f reconpro-api             # Follow logs
#   docker compose down                            # Tear down
#
# First-time setup (generate bootstrap secret):
#   RECONPRO_BOOTSTRAP_SECRET=$(openssl rand -hex 32) docker compose up -d
#
# Health check:
#   curl http://localhost:7890/
#
# Generate API token:
#   curl -X POST http://localhost:7890/auth/token \
#     -H "Content-Type: application/json" \
#     -d '{"bootstrap_secret": "<YOUR_SECRET>", "label": "prod-token", "hours": 720}'
# =============================================================================

services:
  reconpro-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: reconpro:v11-enterprise
    container_name: reconpro-api
    restart: unless-stopped

    # ── Port Mapping ─────────────────────────────────────────────────
    ports:
      - "${RECONPRO_PORT:-7890}:7890"

    # ── Environment Variables ─────────────────────────────────────────
    environment:
      RECONPRO_REQUIRE_AUTH: "true"
      RECONPRO_BOOTSTRAP_SECRET: "${RECONPRO_BOOTSTRAP_SECRET:-change-me-in-production}"
      RECONPRO_LOG_LEVEL: "${RECONPRO_LOG_LEVEL:-INFO}"
      RECONPRO_MAX_WORKERS: "${RECONPRO_MAX_WORKERS:-4}"
      RECONPRO_DEFAULT_TIMEOUT: "${RECONPRO_DEFAULT_TIMEOUT:-8}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    # ── Volume Mounts ─────────────────────────────────────────────────
    volumes:
      - reconpro-data:/home/reconpro/.reconpro

    # ── Resource Limits ───────────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

    # ── Health Check ─────────────────────────────────────────────────
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7890/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

    # ── Security ─────────────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # ── Logging ───────────────────────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "reconpro-api"

    # ── Networking ────────────────────────────────────────────────────
    networks:
      reconpro-net:
        aliases:
          - reconpro-api
          - reconpro

# ── Persistent Volumes ───────────────────────────────────────────────────────
volumes:
  reconpro-data:
    driver: local
    name: reconpro-enterprise-data

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  reconpro-net:
    driver: bridge
    name: reconpro-enterprise-net
    ipam:
      config:
        - subnet: 172.28.0.0/16

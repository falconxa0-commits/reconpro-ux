# =============================================================================
# ReconPro v11 Enterprise — Kubernetes Deployment
# =============================================================================
#
# Usage:
#   kubectl apply -f k8s/configmap.yaml
#   kubectl apply -f k8s/secret.yaml          # Create from secret.yaml.example
#   kubectl apply -f k8s/deployment.yaml
#   kubectl apply -f k8s/service.yaml
#
# Rollout:
#   kubectl rollout status deployment/reconpro-api
#   kubectl rollout restart deployment/reconpro-api
#
# Scale:
#   kubectl scale deployment/reconpro-api --replicas=5
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: reconpro-api
  namespace: reconpro
  labels:
    app.kubernetes.io/name: reconpro-api
    app.kubernetes.io/instance: reconpro-enterprise
    app.kubernetes.io/version: "11.0.0"
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: reconpro
    app.kubernetes.io/managed-by: kubectl
    environment: production
    tier: backend
spec:
  replicas: 3
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app.kubernetes.io/name: reconpro-api
      app.kubernetes.io/instance: reconpro-enterprise

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: reconpro-api
        app.kubernetes.io/instance: reconpro-enterprise
        app.kubernetes.io/version: "11.0.0"
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: reconpro
        environment: production
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7890"
        prometheus.io/path: "/"
        checksum/config: "sha256:DEPLOY_SHA_PLACEHOLDER"

    spec:
      # ── Security Context (Pod-level) ────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # ── Service Account ─────────────────────────────────────────────
      serviceAccountName: reconpro-api
      automountServiceAccountToken: false

      # ── Init Container: Ensure data directory exists ────────────────
      initContainers:
        - name: init-data-dir
          image: busybox:1.36
          command: ["mkdir", "-p", "/data/reconpro/{reports,history,plugins}"]
          volumeMounts:
            - name: reconpro-data
              mountPath: /data/reconpro

      # ── Containers ──────────────────────────────────────────────────
      containers:
        - name: reconpro-api
          image: reconpro:v11-enterprise
          imagePullPolicy: IfNotPresent

          # ── Ports ───────────────────────────────────────────────────
          ports:
            - name: http
              containerPort: 7890
              protocol: TCP

          # ── Environment Variables ──────────────────────────────────
          envFrom:
            - configMapRef:
                name: reconpro-config
            - secretRef:
                name: reconpro-secrets

          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: RECONPRO_DATA_DIR
              value: "/home/reconpro/.reconpro"

          # ── Resource Requests & Limits ──────────────────────────────
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

          # ── Liveness Probe ─────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3

          # ── Readiness Probe ─────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          # ── Startup Probe ──────────────────────────────────────────
          startupProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 12

          # ── Security Context (Container-level) ──────────────────────
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # ── Volume Mounts ──────────────────────────────────────────
          volumeMounts:
            - name: reconpro-data
              mountPath: /home/reconpro/.reconpro
              subPath: reconpro
            - name: tmp
              mountPath: /tmp

          # ── Lifecycle ──────────────────────────────────────────────
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

      # ── Volumes ────────────────────────────────────────────────────
      volumes:
        - name: reconpro-data
          persistentVolumeClaim:
            claimName: reconpro-data-pvc
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

      # ── Topology ───────────────────────────────────────────────────
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: reconpro-api
              app.kubernetes.io/instance: reconpro-enterprise

      # ── Anti-affinity ──────────────────────────────────────────────
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: reconpro-api
                topologyKey: kubernetes.io/hostname

      # ── DNS ────────────────────────────────────────────────────────
      dnsPolicy: ClusterFirst

      # ── Tolerations ────────────────────────────────────────────────
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "reconpro"
          effect: "NoSchedule"

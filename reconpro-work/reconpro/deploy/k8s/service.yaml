# =============================================================================
# ReconPro v11 Enterprise — Kubernetes Service
# =============================================================================
#
# Usage:
#   kubectl apply -f k8s/service.yaml
#
# Test:
#   kubectl get svc reconpro-api -n reconpro
#   kubectl port-forward svc/reconpro-api 7890:7890 -n reconpro
#   curl http://localhost:7890/
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: reconpro-api
  namespace: reconpro
  labels:
    app.kubernetes.io/name: reconpro-api
    app.kubernetes.io/instance: reconpro-enterprise
    app.kubernetes.io/version: "11.0.0"
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: reconpro
    app.kubernetes.io/service: reconpro-api
    environment: production
    tier: backend
  annotations:
    service.kubernetes.io/topology-aware-hints: "auto"
spec:
  type: ClusterIP

  # ── Selector (must match Deployment pod labels) ────────────────────────
  selector:
    app.kubernetes.io/name: reconpro-api
    app.kubernetes.io/instance: reconpro-enterprise

  # ── Ports ───────────────────────────────────────────────────────────────
  ports:
    - name: http
      port: 7890
      targetPort: http
      protocol: TCP
      appProtocol: http

  # ── Session Affinity ─────────────────────────────────────────────────────
  sessionAffinity: None

# =============================================================================
# ReconPro v11 Enterprise — Kubernetes ConfigMap
# =============================================================================
#
# Usage:
#   kubectl apply -f k8s/configmap.yaml
#
# Update:
#   kubectl edit configmap reconpro-config -n reconpro
#   kubectl rollout restart deployment/reconpro-api -n reconpro
#
# View:
#   kubectl get configmap reconpro-config -n reconpro -o yaml
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: reconpro-config
  namespace: reconpro
  labels:
    app.kubernetes.io/name: reconpro-api
    app.kubernetes.io/instance: reconpro-enterprise
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: reconpro
    environment: production
data:
  # ── Authentication ──────────────────────────────────────────────────────
  # Require Bearer token authentication for all API endpoints
  RECONPRO_REQUIRE_AUTH: "true"

  # ── Logging ──────────────────────────────────────────────────────────────
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  RECONPRO_LOG_LEVEL: "INFO"

  # ── Performance ───────────────────────────────────────────────────────────
  # Maximum worker threads for parallel scan operations
  RECONPRO_MAX_WORKERS: "4"

  # Default timeout (seconds) for individual HTTP scan requests
  RECONPRO_DEFAULT_TIMEOUT: "8"
